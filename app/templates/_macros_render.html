{% macro render_table(headers, rows) %}
<table class="table table-striped">
    <!-- формируем заголовок таблицы (имена столбцов) -->
    <thead>
    <tr>
        <!-- выводим имя каждого столбца -->
        {% for item in headers %}
        <th> {{ item }}</th>
        {% endfor %}
    </tr>
    </thead>
    <tbody>
    <!-- для всех строк таблицы -->
    {% for row in rows %}
    <tr>
        <!-- выводим значение каждого столбца -->
        {% for item in row %}
        <td> {{ item }}</td>
        {% endfor %}
    </tr>
    {% endfor %}
    </tbody>
</table>

{% endmacro %}

{% macro render_select(entries, selected, title, id) %}
<label for="{{ id }}">{{ title }}</label>
<select name="{{ id }}" id="{{ id }}">
    {% for entry in entries %}
    <option value="{{ entry.id }}"
    {% if selected == entry.id|string  %} selected {% endif %}
    >{{ entry.name }}</option>
    {% endfor %}
</select>
{% endmacro %}
